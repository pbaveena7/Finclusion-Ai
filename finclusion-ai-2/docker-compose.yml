version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: finclusion_postgres
    restart: always
    environment:
      POSTGRES_USER: finclusion_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: finclusion_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finclusion_user -d finclusion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: finclusion_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://finclusion_user:securepassword@db:5432/finclusion_db
      - JWT_SECRET_KEY=dev_secret_key
      - CORS_ORIGINS=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app # For hot-reloading in dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finclusion_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
